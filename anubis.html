<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anubis 阿努比斯 道具合集 - CS:GO 道具合集</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html" class="back-link">← 返回</a>
      <h1>Anubis 阿努比斯</h1>
      <div class="header-actions">
        <button class="action-btn import-btn" id="importBtn">📥 导入</button>
        <button class="action-btn export-btn" id="exportBtn">📤 导出</button>
        <button class="action-btn add-btn" id="addSpotBtn">+ 添加道具</button>
      </div>
    </header>

    <!-- 地图点位图 -->
    <div class="map-overview-section" id="mapOverviewSection">
      <div class="map-overview-display" id="mapOverviewDisplay" style="display:none">
        <img src="" alt="地图点位图" id="mapOverviewImg">
        <button class="map-overview-change" onclick="document.getElementById('mapOverviewFile').click()">更换图片</button>
      </div>
      <div class="map-overview-upload" id="mapOverviewUpload">
        <p>上传地图点位图</p>
        <div class="file-upload">
          <input type="file" id="mapOverviewFile" accept="image/*" onchange="uploadMapOverview(this)">
          <span class="file-upload-label">选择图片</span>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-group">
        <span class="filter-label">阵营</span>
        <div class="filter-tags">
          <button class="filter-tag active" data-filter="side" data-value="all">全部</button>
          <button class="filter-tag" data-filter="side" data-value="ct">CT</button>
          <button class="filter-tag" data-filter="side" data-value="t">T</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">类型</span>
        <div class="filter-tags">
          <button class="filter-tag active" data-filter="type" data-value="all">全部</button>
          <button class="filter-tag smoke" data-filter="type" data-value="smoke">烟雾弹</button>
          <button class="filter-tag flash" data-filter="type" data-value="flash">闪光弹</button>
          <button class="filter-tag molotov" data-filter="type" data-value="molotov">燃烧弹</button>
          <button class="filter-tag he" data-filter="type" data-value="he">HE手雷</button>
        </div>
      </div>
    </div>

    <div class="gallery" id="gallery">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 道具详情弹窗 -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body">
        <div class="modal-images three-col">
          <div class="modal-image-box">
            <span class="modal-image-label">站位</span>
            <img id="modalLineup" src="" alt="站位截图">
          </div>
          <div class="modal-image-box">
            <span class="modal-image-label">瞄点</span>
            <img id="modalAim" src="" alt="瞄点截图">
          </div>
          <div class="modal-image-box">
            <span class="modal-image-label">效果</span>
            <img id="modalResult" src="" alt="效果图">
          </div>
        </div>
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div class="modal-tags" id="modalTags"></div>
          <p id="modalDesc"></p>
          <div class="modal-lineup">
            <div class="lineup-row"><span class="lineup-label">投掷</span><span id="modalThrow"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加道具弹窗 -->
  <div class="modal" id="addSpotModal">
    <div class="modal-content modal-form">
      <button class="modal-close" id="closeAddSpot">✕</button>
      <h2>添加新道具</h2>
      <form id="addSpotForm">
        <div class="form-row">
          <label>道具名称 *</label>
          <input type="text" id="spotNameInput" placeholder="例如：A大烟" required>
        </div>
        <div class="form-row-double">
          <div class="form-row">
            <label>类型</label>
            <select id="spotTypeInput">
              <option value="smoke">烟雾弹</option>
              <option value="flash">闪光弹</option>
              <option value="molotov">燃烧弹</option>
              <option value="he">HE手雷</option>
            </select>
          </div>
          <div class="form-row">
            <label>阵营</label>
            <select id="spotSideInput">
              <option value="t">T</option>
              <option value="ct">CT</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>说明</label>
          <textarea id="spotDescInput" rows="2" placeholder="这个道具的用途和效果"></textarea>
        </div>
        <div class="form-row">
          <label>投掷方式</label>
          <input type="text" id="spotThrowInput" placeholder="普通投掷 / 跳投 / 反弹投掷">
        </div>
        <div class="form-row-double">
          <div class="form-row">
            <label>站位截图</label>
            <div class="file-upload">
              <input type="file" id="spotLineupInput" accept="image/*" onchange="previewImage(this, 'lineupPreview')">
              <span class="file-upload-label">选择图片</span>
            </div>
            <div class="image-preview" id="lineupPreview" style="display:none">
              <img src="" alt="预览">
            </div>
          </div>
          <div class="form-row">
            <label>瞄点截图</label>
            <div class="file-upload">
              <input type="file" id="spotAimInput" accept="image/*" onchange="previewImage(this, 'aimPreview')">
              <span class="file-upload-label">选择图片</span>
            </div>
            <div class="image-preview" id="aimPreview" style="display:none">
              <img src="" alt="预览">
            </div>
          </div>
        </div>
        <div class="form-row">
          <label>效果图</label>
          <div class="file-upload">
            <input type="file" id="spotResultInput" accept="image/*" onchange="previewImage(this, 'resultPreview')">
            <span class="file-upload-label">选择图片</span>
          </div>
          <div class="image-preview" id="resultPreview" style="display:none">
            <img src="" alt="预览">
          </div>
        </div>
        <button type="submit" class="submit-btn">添加</button>
      </form>
    </div>
  </div>

  <!-- 导入文件弹窗 -->
  <div class="modal" id="importModal">
    <div class="modal-content modal-form" style="max-width:400px;text-align:center;padding:2rem">
      <button class="modal-close" onclick="document.getElementById('importModal').classList.remove('active');document.body.style.overflow=''">✕</button>
      <h2>导入数据</h2>
      <p style="color:var(--text-dim);margin:1rem 0;font-size:0.9rem">选择朋友分享的 JSON 文件</p>
      <div class="file-upload" style="margin:1rem 0">
        <input type="file" id="importFileInput" accept=".json">
        <span class="file-upload-label">选择 JSON 文件</span>
      </div>
      <button class="submit-btn" id="confirmImportBtn">确认导入</button>
    </div>
  </div>

  <script src="js/app.js?v=3"></script>
</body>
</html>
